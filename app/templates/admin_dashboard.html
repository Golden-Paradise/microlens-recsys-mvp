{% extends "base.html" %}
{% block content %}
<header class="page-heading">
  <div>
    <p class="eyebrow">OPERATIONS DASHBOARD</p>
    <h1>运营看板</h1>
    <p class="muted">指标来自当前 SQLite 事件、曝光与推荐请求。</p>
  </div>
  <div class="dashboard-actions">
    <div>
      <span class="control-label">统计范围</span>
      <div id="dashboard-window-control" class="segmented-control window-control" role="tablist" aria-label="Dashboard 统计范围">
        <button type="button" role="tab" aria-selected="false" data-window="1h">1小时</button>
        <button type="button" role="tab" aria-selected="false" data-window="6h">6小时</button>
        <button type="button" role="tab" aria-selected="true" data-window="24h">24小时</button>
        <button type="button" role="tab" aria-selected="false" data-window="all">全部</button>
      </div>
    </div>
    <button id="refresh-dashboard" class="button button-secondary" type="button">刷新数据</button>
  </div>
</header>

<div id="dashboard-error" class="state-panel state-error" hidden></div>
<section aria-labelledby="overview-title">
  <div class="section-heading"><h2 id="overview-title">业务概览</h2></div>
  <div id="overview-metrics" class="metric-grid">
    <div class="metric-card skeleton"></div><div class="metric-card skeleton"></div>
    <div class="metric-card skeleton"></div><div class="metric-card skeleton"></div>
  </div>
</section>

<section class="section-band" aria-labelledby="trend-title">
  <div class="trend-heading">
    <div>
      <h2 id="trend-title">指标趋势</h2>
      <span id="trend-window-meta" class="muted">近24小时</span>
    </div>
    <div id="trend-metric-control" class="segmented-control metric-control" role="tablist" aria-label="趋势指标">
      <button type="button" role="tab" aria-selected="true" data-trend-metric="requests">请求</button>
      <button type="button" role="tab" aria-selected="false" data-trend-metric="exposures">曝光</button>
      <button type="button" role="tab" aria-selected="false" data-trend-metric="clicks">点击</button>
      <button type="button" role="tab" aria-selected="false" data-trend-metric="likes">点赞</button>
      <button type="button" role="tab" aria-selected="false" data-trend-metric="ctr">CTR</button>
    </div>
  </div>
  <div id="trend-stage" class="trend-stage">
    <div id="trend-loading" class="trend-state" role="status">正在加载趋势…</div>
    <div id="trend-error" class="trend-state trend-state-error" role="alert" hidden></div>
    <div id="trend-empty" class="trend-state" hidden>
      <strong>当前范围暂无数据</strong>
      <span>产生推荐请求和行为后，这里会展示真实趋势。</span>
    </div>
    <div id="trend-chart" class="trend-chart" hidden>
      <svg id="dashboard-trend-svg" viewBox="0 0 960 320" role="img" aria-labelledby="dashboard-trend-title dashboard-trend-desc">
        <title id="dashboard-trend-title">请求趋势</title>
        <desc id="dashboard-trend-desc">按时间桶展示 Dashboard 指标变化</desc>
        <g id="dashboard-trend-plot"></g>
      </svg>
      <div id="trend-tooltip" class="trend-tooltip" role="tooltip" hidden></div>
    </div>
  </div>
</section>

<section class="section-band" aria-labelledby="diagnostics-title">
  <div class="section-heading">
    <h2 id="diagnostics-title">信息流诊断</h2>
    <span class="muted">流量占比、热门内容与回退情况</span>
  </div>
  <div id="feed-diagnostics" class="data-region"></div>
  <div class="diagnostic-grid">
    <div>
      <h3>信息流占比</h3>
      <div id="feed-shares" class="data-region"></div>
    </div>
    <div>
      <h3>热门内容</h3>
      <div id="hot-items" class="data-region"></div>
    </div>
  </div>
  <form id="request-trace-form" class="inline-form trace-form">
    <label for="trace-request-id">请求 ID</label>
    <input id="trace-request-id" name="request_id" required minlength="36" maxlength="36" placeholder="输入 Feed 顶部展示的 request_id">
    <button class="button button-secondary" type="submit">查询链路</button>
  </form>
  <div id="request-trace-result" class="data-region muted">可按请求 ID 查看曝光顺序与后续行为。</div>
</section>

<section class="section-band" aria-labelledby="user-debug-title">
  <div class="section-heading"><h2 id="user-debug-title">用户调试</h2></div>
  <form id="user-debug-form" class="inline-form">
    <label for="debug-user-id">用户 ID</label>
    <input id="debug-user-id" name="user_id" type="number" min="1" required placeholder="例如 1">
    <button class="button button-secondary" type="submit">查询</button>
  </form>
  <div id="user-debug-result" class="data-region muted">输入用户 ID 查看画像、行为与推荐上下文。</div>
</section>

<section class="section-band" aria-labelledby="model-title">
  <div class="section-heading"><h2 id="model-title">模型运行</h2></div>
  <div id="model-list" class="data-region"></div>
</section>
{% endblock %}
